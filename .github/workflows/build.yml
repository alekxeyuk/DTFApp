name: build

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x86, ARM]
    steps:
      - uses: actions/checkout@v5

      - name: Add MSBuild to PATH
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found" }
          Write-Host "MSBuild: $msbuild"
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $msbuild -Parent)

      - name: Restore NuGet packages
        run: msbuild DTFApp.sln /t:Restore /p:Configuration=Release /v:minimal

      - name: Build Release|${{ matrix.platform }}
        run: msbuild DTFApp.sln /p:Configuration=Release /p:Platform=${{ matrix.platform }} /m /v:minimal /p:GenerateAppxPackageOnBuild=false /p:AppxBundle=Never /p:DeployOnBuild=false
